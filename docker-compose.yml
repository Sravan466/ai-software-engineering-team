# Local stack: backend + frontend, and whichever model runtime you choose.
#
# The backend doesn't depend on any one runtime. Point it at yours with LOCAL_SOURCES
# in .env — a runtime on this computer is reached from inside the container as
# host.docker.internal:
#
#   LOCAL_SOURCES=LM Studio=http://host.docker.internal:1234
#   LOCAL_SOURCES=llama.cpp=http://host.docker.internal:8080
#
# and `docker compose up`. Or run Ollama in a container next to it — an optional
# profile. Put both lines in .env, so a plain `docker compose up` keeps using it:
#
#   COMPOSE_PROFILES=ollama
#   LOCAL_SOURCES=Ollama=http://ollama:11434
#
#   docker compose exec ollama ollama pull <model>
#
# Keep a runtime on the host listening on 127.0.0.1 only: never 0.0.0.0, and never
# OLLAMA_ORIGINS=* — Docker Desktop reaches 127.0.0.1 through host.docker.internal.
# (On Linux, host.docker.internal needs the host to listen on the docker bridge.)
# Postgres is included but optional — SQLite is the default; uncomment DATABASE_URL to use it.
services:
  ollama:
    image: ollama/ollama:latest
    profiles:
      - ollama
    # Published on this computer's loopback only, not on every interface.
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Inside this container, loopback is the container itself, so the runtime is
      # named rather than found: LOCAL_SOURCES from .env (see the top of this file).
      # Nothing is assumed — a source for a container that isn't running would only
      # be listed as unreachable. A label keeps the source id stable across restarts.
      LOCAL_SOURCES: ${LOCAL_SOURCES:-}
      # A sibling container or this computer's host, not another computer: it shares
      # this host's RAM, so the context window must still be clamped by it. The
      # hostname cannot say so.
      LOCAL_SAME_MACHINE: ${LOCAL_SAME_MACHINE:-true}
      LOCAL_DETECT: "false"
      # Blank the deprecated address an older .env may carry: inside this container
      # `localhost` is not the runtime, and it would only be listed as unreachable.
      OLLAMA_BASE_URL: ""
      CORS_ORIGINS: http://localhost:3000
      # DATABASE_URL: postgresql+psycopg://aiteam:aiteam@postgres:5432/aiteam
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend_data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    depends_on:
      - backend

  # Optional Postgres — switch DATABASE_URL on the backend to use it.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aiteam
      POSTGRES_PASSWORD: aiteam
      POSTGRES_DB: aiteam
    ports:
      - "5432:5432"
    volumes:
      - pg:/var/lib/postgresql/data
    profiles:
      - postgres

volumes:
  ollama:
  backend_data:
  pg:
