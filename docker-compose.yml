# Local stack: a model runtime (Ollama here) + backend + frontend. Any other local
# runtime works the same way — name it in LOCAL_SOURCES below, or add it in Settings.
# Postgres is included but optional — SQLite is the default; uncomment DATABASE_URL to use it.
services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    # After first start, pull the model you want to run — any Ollama model works,
    # and Settings can pull and select one for you without touching this file:
    #   docker compose exec ollama ollama pull <model>
    #   docker compose exec ollama ollama pull nomic-embed-text

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Inside this container, loopback is the container itself, so the runtime is
      # named rather than found: reached by its compose hostname, with a label that
      # keeps its source id stable across restarts. `same_machine`: a sibling
      # container, not another computer — it shares this host's RAM, so the context
      # window must still be clamped by it. The hostname cannot say so.
      LOCAL_SOURCES: '[{"label": "Ollama", "base_url": "http://ollama:11434", "runtime": "ollama", "same_machine": true}]'
      LOCAL_DETECT: "false"
      # Blank the deprecated address an older .env may carry: inside this container
      # `localhost` is not the runtime, and it would only be listed as unreachable.
      OLLAMA_BASE_URL: ""
      CORS_ORIGINS: http://localhost:3000
      # DATABASE_URL: postgresql+psycopg://aiteam:aiteam@postgres:5432/aiteam
    volumes:
      - backend_data:/app/data
    depends_on:
      - ollama

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    depends_on:
      - backend

  # Optional Postgres — switch DATABASE_URL on the backend to use it.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aiteam
      POSTGRES_PASSWORD: aiteam
      POSTGRES_DB: aiteam
    ports:
      - "5432:5432"
    volumes:
      - pg:/var/lib/postgresql/data
    profiles:
      - postgres

volumes:
  ollama:
  backend_data:
  pg:
