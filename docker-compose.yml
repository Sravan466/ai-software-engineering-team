# Local stack: backend + frontend, and whichever model runtime you choose.
#
# The backend doesn't depend on any one runtime. Point it at yours with LOCAL_SOURCES
# in .env — a runtime on this computer is reached from inside the container as
# host.docker.internal:
#
#   LOCAL_SOURCES=[{"label": "LM Studio", "base_url": "http://host.docker.internal:1234", "same_machine": true}]
#
# (`same_machine`: this computer, not another one — so it isn't shown as remote, and
# its window is clamped by this machine's memory. The address alone can't say so.)
#
# and `docker compose up`. Or run Ollama in a container next to it — an optional
# profile. Put both lines in .env, so a plain `docker compose up` keeps using it:
#
#   COMPOSE_PROFILES=ollama
#   LOCAL_SOURCES=[{"label": "Ollama", "base_url": "http://ollama:11434", "runtime": "ollama", "same_machine": true}]
#
#   docker compose exec ollama ollama pull <model>
#
# Keep a runtime on the host listening on 127.0.0.1 only: never 0.0.0.0, and never
# OLLAMA_ORIGINS=* — Docker Desktop reaches 127.0.0.1 through host.docker.internal.
# (On Linux, host.docker.internal needs the host to listen on the docker bridge.)
# Postgres is included but optional — SQLite is the default; uncomment DATABASE_URL to use it.
services:
  ollama:
    image: ollama/ollama:latest
    profiles:
      - ollama
    # Published on this computer's loopback only, not on every interface.
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama

  backend:
    build: ./backend
    # This computer's loopback only. Docker publishes on every interface by default,
    # and anything on the same network could then reach the settings API. To serve
    # it to other machines, change this deliberately and set BACKEND_PUBLIC_URL.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      # Inside this container, loopback is the container itself, so the runtime is
      # named rather than found: LOCAL_SOURCES from .env (see the top of this file).
      # Nothing is assumed — a source for a container that isn't running would only
      # be listed as unreachable. A label keeps the source id stable across restarts.
      LOCAL_SOURCES: ${LOCAL_SOURCES:-}
      LOCAL_DETECT: "false"
      # Blank the deprecated address an older .env may carry: inside this container
      # `localhost` is not the runtime, and it would only be listed as unreachable.
      OLLAMA_BASE_URL: ""
      CORS_ORIGINS: http://localhost:3000
      # Generated code is built and started in the builder service below, never in
      # this container (#75). Set BUILD_RUNNER_TOKEN in .env to require a shared secret.
      BUILD_RUNNER_URL: http://builder:8100
      BUILD_RUNNER_TOKEN: ${BUILD_RUNNER_TOKEN:-}
      # DATABASE_URL: postgresql+psycopg://aiteam:aiteam@postgres:5432/aiteam
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend_data:/app/data
      # The key saved API keys are encrypted with: its own volume, so a copy or
      # backup of the data volume doesn't carry what unlocks it. (Or set
      # SECRETS_ENCRYPTION_KEY in .env / a Docker secret.)
      - backend_secrets:/root/.config/aiteam
    depends_on:
      - builder

  # Builds and starts the generated code (#75): `npm install` + `npm run build`, a
  # Python import, a Node boot — each step in its own throwaway container, with no
  # network after the packages download, a memory/CPU/time cap, and nothing of the
  # platform's mounted. It holds the Docker socket so the backend never has to, and
  # it has none of the backend's volumes. Not published: only the backend reaches it.
  builder:
    build:
      context: ./backend
      dockerfile: Dockerfile.builder
    expose:
      - "8100"
    environment:
      BUILDER_TOKEN: ${BUILD_RUNNER_TOKEN:-}
      BUILDER_CONCURRENCY: ${BUILD_RUN_CONCURRENCY:-2}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    depends_on:
      - backend

  # Optional Postgres — switch DATABASE_URL on the backend to use it.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aiteam
      POSTGRES_PASSWORD: aiteam
      POSTGRES_DB: aiteam
    ports:
      - "5432:5432"
    volumes:
      - pg:/var/lib/postgresql/data
    profiles:
      - postgres

volumes:
  ollama:
  backend_data:
  backend_secrets:
  pg:
